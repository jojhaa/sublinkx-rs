x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:-docker.io/jojhaa/sublinkx-rs-backend:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8080
      SUBLINKX_RUNTIME_MODE: docker
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/app.db}
      SUBLINKX_MIGRATION_SOURCE_URL: ${SUBLINKX_MIGRATION_SOURCE_URL:-}
      SUBLINKX_MIGRATION_TARGET_URL: ${SUBLINKX_MIGRATION_TARGET_URL:-}
      SUBLINKX_MIGRATION_CONFIRM: ${SUBLINKX_MIGRATION_CONFIRM:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be a non-default value of at least 32 characters}
      JWT_EXP_HOURS: ${JWT_EXP_HOURS:-24}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required for first production bootstrap}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required and must not use the default first-login password}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # Prefer a unique Docker network alias such as ip-intelligence-api when
      # connecting another Compose stack. Both stacks may have a backend service.
      IP_INTELLIGENCE_ENABLED: ${IP_INTELLIGENCE_ENABLED:-false}
      IP_INTELLIGENCE_BASE_URL: ${IP_INTELLIGENCE_BASE_URL:-}
      IP_INTELLIGENCE_API_TOKEN: ${IP_INTELLIGENCE_API_TOKEN:-}
      IP_INTELLIGENCE_SOURCE_KEY: ${IP_INTELLIGENCE_SOURCE_KEY:-sublinkx-rs-production}
    volumes:
      - ${BACKEND_DATA_DIR:-./docker-data/backend}:/app/data
      - ${MIHOMO_CORE_DIR:-./docker-data/mihomo}:/app/mihomo
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      sublinkx_net:
        aliases:
          - sublinkx-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    profiles:
      - mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sublinkx}
      MYSQL_USER: ${MYSQL_USER:-sublinkx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required when the mysql profile is enabled}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required when the mysql profile is enabled}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${MYSQL_DATA_DIR:-./docker-data/mysql}:/var/lib/mysql
    networks:
      - sublinkx_net
    logging: *default-logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sublinkx}
      POSTGRES_USER: ${POSTGRES_USER:-sublinkx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/postgres}:/var/lib/postgresql/data
    networks:
      - sublinkx_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-docker.io/jojhaa/sublinkx-rs-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - sublinkx_net
    logging: *default-logging

networks:
  sublinkx_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBLINKX_DOCKER_SUBNET:-172.31.88.0/24}
